name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- site tools/site-publication-policy.json vercel.json
      - run: node --test tests/site.test.mjs tests/docs-policy.test.mjs tests/evaluation.test.mjs tests/search-identity.test.mjs
      - run: node tools/check_public_site.mjs

  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The public suite for the builder tests; the same commit as the emberbench pin in requirements.txt.
      - uses: actions/checkout@v4
        with:
          repository: Aryabhatta-0/EMBERBench
          ref: 29fdbce76f2111847b41576f5c12dc1df0338627
          path: emberbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m mypy
      - run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Start static preview
        run: python -m http.server 8917 --bind 127.0.0.1 --directory site > /tmp/anantam-preview.log 2>&1 &
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anantam-browser-evidence
          path: |
            work/browser/
            work/experience/
            work/navigation/
            work/evaluation/
