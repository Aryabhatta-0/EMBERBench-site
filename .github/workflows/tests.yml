name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/site.test.mjs

  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The public suite for the builder tests; the same commit as the emberbench pin in requirements.txt.
      - uses: actions/checkout@v4
        with:
          repository: Aryabhatta-0/EMBERBench
          ref: 29fdbce76f2111847b41576f5c12dc1df0338627
          path: emberbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m mypy
      - run: python -m pytest -q
